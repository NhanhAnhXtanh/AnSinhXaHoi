plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dth'
version = '0.0.1-SNAPSHOT'
description = 'dth-framework'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Authentication / authorisation. The resource-server starter is what pulls
    // in Nimbus JOSE, which is how access tokens are signed and verified — see
    // shared/security/JwtService.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // The live channel. STOMP over WebSocket rather than raw frames, because it
    // is what lets the access token travel in the CONNECT frame -- the browser's
    // WebSocket constructor cannot set an Authorization header.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Row-level security reports two things an operator has to be able to see
    // without reading logs: whether any policy had to be quarantined at boot
    // (RowLevelHealthIndicator), and how often the deliberate bypass is used
    // (the rowlevel.bypass counter). Both need actuator, and it is what brings
    // Micrometer with it.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Not runtimeOnly: PostgresEventBus compiles against PGConnection to
    // hold a LISTEN subscription, which is how permission changes and
    // notifications reach the other nodes. That is the one place this
    // application knows which database it is talking to.
    implementation 'org.postgresql:postgresql'
    // ASXH: chạy script của phiên bản mẫu (hook getInputData / validate) phía máy chủ khi
    // đơn vị nộp và khi Sở duyệt phiếu — xem module/asxh/script/ServerScriptRunner. Bản
    // community (js-community), dòng 25.x dựng cho JDK 25; trên JDK thường (không phải GraalVM)
    // nó chạy chế độ thông dịch, đủ cho script đọc vài trăm ô.
    implementation 'org.graalvm.polyglot:polyglot:25.3.4.1'
    implementation 'org.graalvm.polyglot:js-community:25.3.4.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Source files are UTF-8, and on Windows javac would otherwise read them with
// the platform charset -- which is silent for comments and javadoc, and turns
// any non-ASCII character in a *string literal* into mojibake the first time
// somebody sees it in an API response or a health check.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// `gradlew bootRun` nạp backend/.env làm biến môi trường (biến thật thắng, giá trị trống bỏ qua).
// Task test không đọc tệp này.
def readDotEnv(File file) {
    def values = [:]
    if (!file.exists()) {
        return values
    }
    file.eachLine('UTF-8') { line ->
        def text = line.trim()
        if (!text || text.startsWith('#')) {
            return
        }
        int eq = text.indexOf('=')
        if (eq < 1) {
            return
        }
        def key = text.substring(0, eq).trim()
        def value = text.substring(eq + 1).trim()
        if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"'))
                || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        value = value.replaceAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/) { all, name ->
            System.getenv(name) ?: values[name] ?: ''
        }
        values[key] = value
    }
    return values.findAll { key, value -> value && System.getenv(key) == null }
}

tasks.named('bootRun') {
    environment readDotEnv(file('.env'))
}

// CI chia test làm hai job: -PtestGroup=asxh chỉ chạy test nghiệp vụ ASXH
// (com.dth.frw.module.asxh), -PtestGroup=platform chạy mọi test còn lại.
// Không truyền thì chạy hết như trước.
tasks.named('test') {
    useJUnitPlatform()
    def testGroup = findProperty('testGroup')
    if (testGroup == 'asxh') {
        include 'com/dth/frw/module/asxh/**'
    } else if (testGroup == 'platform') {
        exclude 'com/dth/frw/module/asxh/**'
    }
}
