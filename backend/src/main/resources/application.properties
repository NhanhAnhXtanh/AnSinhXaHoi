spring.application.name=dth-framework

server.port=8114

spring.datasource.url=jdbc:postgresql://localhost:5433/dth-framework
spring.datasource.username=postgres
spring.datasource.password=Abcd@1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.jackson.time-zone=UTC
spring.jackson.deserialization.accept-float-as-int=false

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:dev-only-secret-change-me-in-every-real-deployment}
app.security.jwt.issuer=dth-framework
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d

app.cors.allowed-origins=http://localhost:8765,http://127.0.0.1:8765

server.tomcat.relaxed-query-chars=[,]

server.compression.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

asxh.attachments.storage-dir=${ASXH_ATTACHMENTS_DIR:./data/attachments}
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=110MB
