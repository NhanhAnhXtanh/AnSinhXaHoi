spring.application.name=dth-framework

# --- Cổng HTTP ---------------------------------------------------------------
# Cổng backend: BACKEND_PORT trong tệp .env ở gốc repo (dùng chung với giao diện, xem .env.example).
# SERVER_PORT — tên chuẩn của Spring Boot — vẫn dùng được và thắng nếu có cả hai.
server.port=${BACKEND_PORT:8114}

# --- Datasource -------------------------------------------------------------
# Local PostgreSQL. Override any of these with the matching SPRING_DATASOURCE_*
# environment variable (or the same names in the repo-root .env when running
# `gradlew bootRun`) rather than editing this file per machine.
spring.datasource.url=jdbc:postgresql://localhost:5433/dth-framework
spring.datasource.username=postgres
spring.datasource.password=Abcd@1234
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA --------------------------------------------------------------------
# Liquibase owns the schema; Hibernate only validates that the entities and the
# migrated tables still agree, so a drifted mapping fails at startup instead of
# at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Liquibase --------------------------------------------------------------
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# --- JSON -------------------------------------------------------------------
# Jackson 3 (Boot 4) already writes java.time values as ISO-8601 strings, which
# is what the admin UI needs 'new Date()' to be able to parse; only the zone
# has to be pinned so timestamps do not shift with the server default.
spring.jackson.time-zone=UTC
# A fraction sent for a whole-number field (a year of 2035.5) is refused with
# a 400 instead of being silently cut to 2035: the truncated value would be
# saved as if the user had typed it.
spring.jackson.deserialization.accept-float-as-int=false

# --- Security ---------------------------------------------------------------
# HMAC key the access tokens are signed with. HS256 needs at least 32 bytes and
# the application refuses to start with less. The value below is a development
# default and is in version control, which is exactly why every deployment must
# override it with APP_SECURITY_JWT_SECRET: anyone holding this string can
# mint a token for any account.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:dev-only-secret-change-me-in-every-real-deployment}
app.security.jwt.issuer=dth-framework
# Short, because nothing can revoke an access token before it expires: this is
# how long a role change or a disabled account takes to actually bite.
app.security.jwt.access-token-ttl=15m
# How long a session survives without signing in again. Rotated on every use.
app.security.jwt.refresh-token-ttl=7d

# --- CORS -------------------------------------------------------------------
# Giao diện (Vite) ở cổng FRONTEND_PORT của tệp .env. Mở từ địa chỉ khác (IP máy chủ, tên miền)
# thì khai APP_CORS_ALLOWED_ORIGINS: danh sách đầy đủ, cách nhau dấu phẩy.
app.cors.allowed-origins=http://localhost:${FRONTEND_PORT:8765},http://127.0.0.1:${FRONTEND_PORT:8765}

# --- HTTP connector ---------------------------------------------------------
# Square brackets are legal here because Refine's data provider sends them:
# `getMany` builds `?ids[0]=1&ids[1]=2` through qs, which encodes values but not
# keys, and the browser's URL parser leaves `[` and `]` alone in a query string.
#
# Tomcat rejects them by default -- they are gen-delims that RFC 3986 does not
# permit outside a host -- and it does so in the connector, before any filter
# runs. That produces a 400 HTML page with no CORS headers, so the browser
# reports the failure as a CORS error on the preflight and the real cause is
# nowhere in it. `ListParams.ids()` already parses `ids[0]`; the request simply
# never reached it.
#
# Two characters, in the query string only. The path parser is untouched.
server.tomcat.relaxed-query-chars=[,]

# --- Nén response (ASXH) -----------------------------------------------------
# Workbook SpreadJS đi trong JSON rất to và nén rất tốt: khung "01-TONGHOP" của màn
# Tổng hợp năm ~20 MB còn ~0,3 MB khi gzip; 14 biểu của một phiếu ~3,4 MB còn ~65 KB.
# Không nén thì người dùng ở xa máy chủ phải tải nguyên vài chục MB mỗi lần mở màn.
# Chỉ nén response từ 2 KB (mặc định của Spring) và các kiểu chữ mặc định, gồm
# application/json; tệp đính kèm (PDF, ảnh) không bị nén lại.
server.compression.enabled=true

# --- Actuator ---------------------------------------------------------------
# Health only, and details only for a caller that authenticated. The row-level
# indicator turns the check DOWN while any policy is quarantined and lists which
# ones -- a policy that is not applying is a security control that is not
# applying, and the whole point of quarantining rather than refusing to start is
# that it must not then be invisible. Without details the check says DOWN and
# nothing else, which is a page at 3am with nowhere to go.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# --- ASXH: file đính kèm phiếu (xác nhận Kho bạc) -----------------------------
# Nội dung file nằm NGOÀI CSDL, trong thư mục này (CSDL chỉ giữ đường dẫn tương
# đối) -- sao lưu phải gồm cả thư mục. Ghi đè bằng ASXH_ATTACHMENTS_DIR.
asxh.attachments.storage-dir=${ASXH_ATTACHMENTS_DIR:./data/attachments}
# Mặc định của Spring chỉ nhận file 1MB; mỗi file tối đa 10MB (máy chủ kiểm lại trong
# AttachmentFiles). Nộp báo cáo năm gửi tối đa 10 file trong một lần, nên cả request
# được tới 110MB.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=110MB
