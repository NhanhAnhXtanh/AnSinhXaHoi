# CI backend (Spring Boot, JDK 25). Chỉ kiểm, KHÔNG triển khai.
# Chạy khi PR hoặc push vào main / nhatanh có đổi trong backend/ (hoặc chính file này).
#
# - Biên dịch: compileJava + compileTestJava, không cần CSDL — lỗi biên dịch báo sớm, một chỗ.
# - Test nghiệp vụ ASXH: com.dth.frw.module.asxh.* (kỳ, mẫu, phiếu nhập, sổ cái, tổng hợp, script…).
# - Test bảo mật & nền tảng: mọi test còn lại (phân quyền theo dòng, token, user, shared, config).
# Hai job test chạy song song, mỗi job một Postgres 16 trống; Liquibase dựng schema + seed.
name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, nhatanh]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  compile:
    name: Biên dịch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # gradlew trong repo không mang bit thực thi, nên gọi qua bash.
      - run: bash ./gradlew --no-daemon compileJava compileTestJava

  test:
    name: ${{ matrix.title }}
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: asxh
            title: Test nghiệp vụ ASXH
          - group: platform
            title: Test bảo mật & nền tảng
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dth-framework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dth-framework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dth-framework
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon test -PtestGroup=${{ matrix.group }}
      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report-${{ matrix.group }}
          path: backend/build/reports/tests/test
          retention-days: 7
