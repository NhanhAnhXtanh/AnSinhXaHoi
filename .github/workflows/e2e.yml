# E2E Playwright 4 luồng chính (ASX-159..162). Nặng (dựng cả backend lẫn frontend) nên không chạy
# trên PR: chạy sau khi code vào main, hoặc bấm tay (Actions → E2E → Run workflow).
name: E2E

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "25"

jobs:
  e2e:
    name: E2E — Playwright 4 luồng chính
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dth-framework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dth-framework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      E2E_API_URL: http://localhost:8090/api
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dth-framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: bash ./gradlew --no-daemon bootJar
      - name: Start backend (:8090)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dth-framework
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SERVER_PORT: "8090"
          ASXH_ATTACHMENTS_DIR: ${{ runner.temp }}/attachments
          SPRING_APPLICATION_JSON: '{"app.cors.allowed-origins":"http://localhost:4180","asxh.period-status-job.run-on-startup":false}'
        run: |
          jar=$(ls build/libs/*.jar | grep -v plain | head -n1)
          nohup java -Xmx1g -jar "$jar" > "$RUNNER_TEMP/backend.log" 2>&1 &
          # /actuator/health cần đăng nhập, nên chờ tới khi API đăng nhập trả lời.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"Admin@123"}' "$E2E_API_URL/auth/login" || true)
            if [ "$code" = "200" ]; then echo "backend sẵn sàng"; exit 0; fi
            sleep 2
          done
          echo "backend không lên"; tail -n 200 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend (bật móc e2e)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8090/api
          VITE_E2E_HOOKS: "1"
          VITE_SPREADJS_LICENSE_KEY: ${{ secrets.VITE_SPREADJS_LICENSE_KEY }}
          VITE_SPREADJS_DESIGNER_LICENSE_KEY: ${{ secrets.VITE_SPREADJS_DESIGNER_LICENSE_KEY }}
        run: npx vite build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright (preview :4180 do playwright.config.ts tự bật)
        working-directory: frontend
        # Chỉ 4 luồng chính 01–04. Bộ 90–96 (biên, gian lận, toàn chức năng) dựa vào dữ liệu và
        # tài khoản của CSDL thử dth-framework máy local, chạy tay từng file.
        run: npm run e2e -- "e2e/0[1-4]-"

      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Lưu log backend khi lỗi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 7
