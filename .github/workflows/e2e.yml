# E2E Playwright 4 luồng chính (ASX-159..162). Nặng (dựng cả backend lẫn frontend) nên KHÔNG chạy
# tự động trên PR hay push — chỉ chạy khi bấm tay: Actions → E2E → Run workflow.
name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "25"

jobs:
  e2e:
    name: E2E — Playwright 4 luồng chính
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dth-framework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dth-framework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      E2E_API_URL: http://localhost:8090/api
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dth-framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: bash ./gradlew --no-daemon bootJar
      - name: Start backend (:8090)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dth-framework
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SERVER_PORT: "8090"
          ASXH_ATTACHMENTS_DIR: ${{ runner.temp }}/attachments
          SPRING_APPLICATION_JSON: '{"app.cors.allowed-origins":"http://localhost:4180","asxh.period-status-job.run-on-startup":false}'
        run: |
          jar=$(ls build/libs/*.jar | grep -v plain | head -n1)
          nohup java -Xmx1g -jar "$jar" > "${{ runner.temp }}/backend.log" 2>&1 &
          # /actuator/health cần đăng nhập, nên chờ tới khi API đăng nhập trả lời.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"Admin@123"}' "$E2E_API_URL/auth/login" || true)
            if [ "$code" = "200" ]; then echo "backend sẵn sàng"; exit 0; fi
            sleep 2
          done
          echo "backend không lên"; tail -n 200 "${{ runner.temp }}/backend.log"; exit 1

      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend (bật móc e2e)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8090/api
          VITE_E2E_HOOKS: "1"
          VITE_SPREADJS_LICENSE_KEY: ${{ secrets.VITE_SPREADJS_LICENSE_KEY }}
          VITE_SPREADJS_DESIGNER_LICENSE_KEY: ${{ secrets.VITE_SPREADJS_DESIGNER_LICENSE_KEY }}
        run: npx vite build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright (preview :4180 do playwright.config.ts tự bật)
        working-directory: frontend
        run: npm run e2e

      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Lưu log backend khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 7
