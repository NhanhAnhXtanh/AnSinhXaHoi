# CI cho ASXH (Spring Boot backend + React frontend). Chỉ kiểm, KHÔNG triển khai.
#
# Một workflow, lọc theo thư mục BÊN TRONG (job "Thay đổi"): phần không đổi thì job bị bỏ qua theo
# `if:`, GitHub tính là đạt — nên "CI ok" dùng làm check bắt buộc khi bảo vệ main mà PR chỉ đổi một
# phần (hay chỉ đổi tài liệu) không bị kẹt chờ.
#
# Mọi job kiểm chạy SONG SONG ngay sau "Thay đổi": biên dịch backend và kiểu / lint / kiến trúc
# frontend vẫn báo lỗi sớm, nhưng test backend và build frontend không đợi chúng (trước đây đợi,
# mất thêm ~45 giây mỗi nhánh). Phần rất nặng (E2E) ở workflow riêng, chỉ chạy trên main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"

jobs:
  changes:
    name: Thay đổi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Bấm tay thì chạy hết.
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend-compile:
    name: Backend · Biên dịch
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # gradlew trong repo không mang bit thực thi, nên gọi qua bash.
      - run: bash ./gradlew --no-daemon compileJava compileTestJava

  backend-test:
    name: Backend · Test (${{ matrix.title }})
    # Không đợi "Biên dịch": gradle test tự biên dịch; job đó chỉ để báo lỗi biên dịch sớm.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: asxh
            title: nghiệp vụ ASXH
          - group: platform
            title: bảo mật & nền tảng
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dth-framework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dth-framework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dth-framework
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test (Liquibase dựng schema + seed trên CSDL trống)
        run: bash ./gradlew --no-daemon test -PtestGroup="$TEST_GROUP"
      - name: Tóm tắt test lên trang lượt chạy
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          failures = []
          for path in glob.glob("build/test-results/test/*.xml"):
              suite = ET.parse(path).getroot()
              total += int(suite.get("tests", 0))
              skipped += int(suite.get("skipped", 0))
              for case in suite.iter("testcase"):
                  bad = case.find("failure")
                  if bad is None:
                      bad = case.find("error")
                  if bad is not None:
                      failed += 1
                      msg = (bad.get("message") or "").splitlines()[0:1]
                      failures.append(f"| `{case.get('classname')}` | {case.get('name')} | {msg[0][:200] if msg else ''} |")
          print(f"### Test backend nhóm `{os.environ['TEST_GROUP']}`")
          print(f"{total} test · {failed} hỏng · {skipped} bỏ qua")
          if failures:
              print("\n| Lớp | Test | Lỗi |\n|---|---|---|")
              print("\n".join(failures))
          PY
      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-report-${{ matrix.group }}
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend-check:
    name: Frontend · ${{ matrix.title }}
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            title: Kiểu (TypeScript)
          - check: lint
            title: Lint (ESLint)
          - check: architecture
            title: Kiến trúc tầng
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Mã ứng dụng
        if: matrix.check == 'typecheck'
        run: npx tsc --noEmit
      - name: Mã e2e
        if: matrix.check == 'typecheck'
        run: npx tsc -p e2e --noEmit
      - if: matrix.check == 'lint'
        run: npx eslint .
      - name: Luật phụ thuộc app / features / shared / domains
        if: matrix.check == 'architecture'
        run: npm run verify:arch

  frontend-build:
    name: Frontend · Build & dung lượng
    # Không đợi kiểu / lint / kiến trúc — build là job lâu nhất, chạy song song với chúng.
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      # Bản build SpreadJS cần nhiều heap (cục bộ: 3 GB không đủ).
      NODE_OPTIONS: --max-old-space-size=6144
      # Rỗng vẫn build được (bảng tính chạy bản dùng thử).
      VITE_SPREADJS_LICENSE_KEY: ${{ secrets.VITE_SPREADJS_LICENSE_KEY }}
      VITE_SPREADJS_DESIGNER_LICENSE_KEY: ${{ secrets.VITE_SPREADJS_DESIGNER_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` = `tsc && refine build`; job "Kiểu (TypeScript)" đã chạy tsc nên ở đây
      # chỉ đóng gói.
      - name: Build
        run: npx refine build
      - name: Trang đầu không tải SpreadJS / Designer / Monaco
        run: npm run verify:bundle

  ci-ok:
    name: CI ok
    if: ${{ always() }}
    needs: [changes, backend-compile, backend-test, frontend-check, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mọi job cần chạy đều đạt (bỏ qua vì không đổi = đạt)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Kết quả các job: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "Có job hỏng hoặc bị huỷ."; exit 1 ;;
          esac
