# Dependabot mở PR cập nhật thư viện vào hai nhánh nhatanh và main, cùng lịch thứ Hai hằng tuần.
# Bản vá + bản nhỏ gom chung một PR mỗi hệ sinh thái để đỡ nhiễu; bản lớn tách riêng từng PR.
# Mỗi khối dưới đây là một (hệ sinh thái, nhánh) — Dependabot cho phép trùng thư mục khi khác
# target-branch.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    target-branch: nhatanh
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # Chỉ đề xuất bản đã phát hành >= 7 ngày: tránh dính bản bị chèn mã độc vừa tung ra.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: nhatanh
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # Chỉ đề xuất bản đã phát hành >= 7 ngày: tránh dính bản bị chèn mã độc vừa tung ra.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Giấy phép SpreadJS gắn với bản lớn: lên bản lớn phải mua key mới, làm tay.
      - dependency-name: "@mescius/*"
        update-types: ["version-update:semver-major"]
      # Monaco còn ở 0.x nên bản "nhỏ" cũng đổi cấu trúc gói (0.57 bỏ đường dẫn esm/vs/... mà
      # script-editor/monaco-setup.ts import): lên Monaco là việc riêng, làm tay.
      - dependency-name: "monaco-editor"

  - package-ecosystem: github-actions
    directory: /
    target-branch: nhatanh
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    # Chỉ đề xuất bản đã phát hành >= 7 ngày: tránh dính bản bị chèn mã độc vừa tung ra.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # Chỉ đề xuất bản đã phát hành >= 7 ngày: tránh dính bản bị chèn mã độc vừa tung ra.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    # Chỉ đề xuất bản đã phát hành >= 7 ngày: tránh dính bản bị chèn mã độc vừa tung ra.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Giấy phép SpreadJS gắn với bản lớn: lên bản lớn phải mua key mới, làm tay.
      - dependency-name: "@mescius/*"
        update-types: ["version-update:semver-major"]
      # Monaco còn ở 0.x nên bản "nhỏ" cũng đổi cấu trúc gói (0.57 bỏ đường dẫn esm/vs/... mà
      # script-editor/monaco-setup.ts import): lên Monaco là việc riêng, làm tay.
      - dependency-name: "monaco-editor"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    # Chỉ đề xuất bản đã phát hành >= 7 ngày: tránh dính bản bị chèn mã độc vừa tung ra.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
